name: static-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile core modules
        working-directory: artifacts/k31/trainer-source
        run: python -m py_compile app.py game_memory.py build.py
      - name: Run offline structure tests
        working-directory: artifacts/k31/trainer-source
        run: python -m unittest discover -s tests -p "test_offline.py" -v
